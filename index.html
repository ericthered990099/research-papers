<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet">
<title>Research Papers — Tanishk Wankhade</title>
<style>
:root{
  --bg:#000000;
  --ink:#f4f4f4;
  --ink-soft:#8c8c8c;
  --ink-faint:#5e5e5e;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--ink-soft);
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
  font-weight:600;
  letter-spacing:-.014em;
  -webkit-font-smoothing:antialiased;
}

.page{
  width:100%;max-width:520px;margin:0 auto;
  padding:26px 26px 80px;
  min-height:100%;
  display:flex;flex-direction:column;
}

.mark{width:26px;height:26px;color:var(--ink);margin-bottom:38px}
.mark svg{width:100%;height:100%;display:block}

.bio{font-size:19px;line-height:1.45;max-width:31ch}
.bio + .bio{margin-top:1.1em}
.bio strong{color:var(--ink)}

/* ---------- file ---------- */
.stage{margin-top:auto;padding-top:72px;display:flex;justify-content:center}

.file{
  display:block;
  text-decoration:none;
  text-align:center;
  padding:8px 12px;
  border-radius:10px;
  width:230px;
  -webkit-tap-highlight-color:transparent;
}
.file:focus-visible{outline:1px solid rgba(255,255,255,.4);outline-offset:2px}

.file img{
  display:block;
  width:132px;height:132px;
  margin:0 auto 12px;
}
.file-name{
  color:var(--ink);
  font-size:17px;
  line-height:1.3;
}
.file-sub{
  margin-top:3px;
  font-size:15px;
  color:var(--ink-faint);
}
.file-meta{
  margin-top:9px;
  font-size:13px;
  color:var(--ink-faint);
}

@media (max-width:420px){
  .bio{font-size:17.5px}
  .file img{width:118px;height:118px}
}
@media (min-width:760px){
  .page{max-width:560px;padding-top:56px}
  .bio{font-size:20px}
}
</style>
</head>
